server:
  port: 8093

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          payment-service-client:
            provider: sso-server
            client-id: order-service
            client-secret: admin123  # Plaintext tương ứng với mã băm đã cấu hình ở V13
            authorization-grant-type: client_credentials
            scope: payment:write
        provider:
          sso-server:
            token-uri: http://localhost:9000/oauth2/token
