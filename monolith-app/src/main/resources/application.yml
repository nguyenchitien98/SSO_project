server:
  port: 8080

spring:
  application:
    name: monolith-app

  # Database DataSource configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/monolith_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database Migration (Flyway)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Cache and Session Storage (Redis)
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    redis:
      namespace: monolith:session

  # Security OAuth2 Client & Resource Server Configuration
  security:
    oauth2:
      client:
        registration:
          sso:
            client-id: monolith-web
            client-authentication-method: none # Sử dụng flow PKCE (Public Client)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/sso"
            scope: openid,profile,email
            provider: sso-provider
            client-name: Monolith Web App
        provider:
          sso-provider:
            issuer-uri: http://localhost:9000
            user-name-attribute: sub
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
